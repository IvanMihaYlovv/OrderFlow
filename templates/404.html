{% extends 'base.html' %}

{% block title %}404 | OrderFlow{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <p class="error-code">404</p>

        <h1>Страницата не е намерена</h1>

        <p class="error-message">
            Изглежда, че страницата, която търсиш, не съществува
            или вече е преместена.
        </p>

        <a href="{% url 'product-list' %}" class="btn">Разгледай каталога</a>
    </div>
</section>
{% endblock %}
