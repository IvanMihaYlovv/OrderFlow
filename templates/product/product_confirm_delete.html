{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
    <div class="card">
        <h1>Delete Product</h1>

        <p>
            Are you sure you want to delete "{{ product.name }}"?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-red">Yes, delete product</button>
        </form>

        <a href="{% url 'product-list' %}" class="btn btn-grey">Cancel</a>
    </div>
{% endblock %}
