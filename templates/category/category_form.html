{% extends 'base.html' %}

{% block title %}Category Form{% endblock %}

{% block content %}
    <div class="card">
        <h1>
            {% if category %}
                Edit Category
            {% else %}
                Create Category
            {% endif %}
        </h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn">Save</button>
        </form>

        <a href="{% url 'category-list' %}" class="btn btn-grey">Cancel</a>
    </div>
{% endblock %}
